# Treehouse worktree pool — https://github.com/kunchenguid/treehouse
# Pool lives at ~/.treehouse/skibidi (default root).
max_trees = 8

# Alur branch: feat/* -> test -> staging -> main (.ai/rules/git-workflow.md).
# Worktrees dipotong dari `test` — branch tujuan PR fitur; staging hanya
# menerima promosi dari test, main hanya menerima rilis.
base_branch = "test"
